name: OpenWrt 25.12.5

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/source.test.cjs
      - run: bash -n scripts/build-openwrt.sh

  sdk:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPENWRT_URL: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64
      SDK_ARCHIVE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      SDK_SHA256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
      ROOTFS_ARCHIVE: openwrt-25.12.5-x86-64-generic-targz-rootfs.tar.gz
      ROOTFS_SHA256: 4f191a9684949b15db02bb1ccdacaa8192ffb4598ce92e70b5337ca50df7912a
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget zstd
      - name: Prepare official SDK
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$SDK_ARCHIVE" \
            "$OPENWRT_URL/$SDK_ARCHIVE"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/$SDK_ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "$RUNNER_TEMP/$SDK_ARCHIVE" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
      - name: Test Xray configuration in OpenWrt userspace
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ROOTFS_ARCHIVE" "$OPENWRT_URL/$ROOTFS_ARCHIVE"
          printf '%s  %s\n' "$ROOTFS_SHA256" "$RUNNER_TEMP/$ROOTFS_ARCHIVE" | sha256sum --check
          rootfs="$RUNNER_TEMP/openwrt-rootfs"
          mkdir "$rootfs"
          sudo tar -xzf "$RUNNER_TEMP/$ROOTFS_ARCHIVE" -C "$rootfs"
          sudo mkdir -p "$rootfs/dev" "$rootfs/proc" "$rootfs/tmp/lock" "$rootfs/usr/libexec/exconnect"
          sudo cp -L --remove-destination /etc/resolv.conf "$rootfs/etc/resolv.conf"
          sudo cp tests/runtime.sh "$rootfs/tmp/runtime.sh"
          sudo cp packages/exconnect/files/usr/libexec/exconnect/*.uc "$rootfs/usr/libexec/exconnect/"
          sudo unshare --mount --propagation private bash -e -c '
            rootfs=$1
            mount --bind /dev "$rootfs/dev"
            mount -t proc proc "$rootfs/proc"
            chroot "$rootfs" /bin/sh -ec "apk update && apk add xray-core ucode ucode-mod-fs ucode-mod-uci jsonfilter coreutils-base64 diffutils"
            chroot "$rootfs" /bin/sh /tmp/runtime.sh
          ' bash "$rootfs"
      - name: Build packages
        run: bash scripts/build-openwrt.sh "$RUNNER_TEMP/openwrt-sdk"
      - name: Test installation of the built packages
        run: |
          set -- dist/exconnect-[0-9]*.apk dist/luci-app-exconnect-[0-9]*.apk
          test "$#" -eq 2
          test -f "$1"
          test -f "$2"
          rootfs="$RUNNER_TEMP/openwrt-install-test"
          mkdir "$rootfs"
          sudo tar -xzf "$RUNNER_TEMP/$ROOTFS_ARCHIVE" -C "$rootfs"
          sudo mkdir -p "$rootfs/dev" "$rootfs/proc" "$rootfs/tmp/lock"
          sudo cp -L --remove-destination /etc/resolv.conf "$rootfs/etc/resolv.conf"
          python3 -m zipfile -c "$RUNNER_TEMP/exconnect-apks.zip" "$@"
          sudo cp "$RUNNER_TEMP/exconnect-apks.zip" scripts/install-openwrt.sh \
            tests/installer-smoke.sh tests/runtime.sh tests/proxy-smoke.sh "$rootfs/tmp/"
          sudo unshare --mount --propagation private bash -e -s -- "$rootfs" <<'HOST'
          rootfs=$1
          mount --bind /dev "$rootfs/dev"
          mount -t proc proc "$rootfs/proc"
          chroot "$rootfs" /bin/sh -e -s <<'OPENWRT'
          apk update
          # Treat the chroot as an offline image so package hooks cannot start services or load modules.
          IPKG_INSTROOT=/ apk add jsonfilter unzip
          IPKG_INSTROOT=/ /bin/sh /tmp/installer-smoke.sh /tmp/install-openwrt.sh /tmp/exconnect-apks.zip
          for package in exconnect luci-app-exconnect xray-core luci-light uhttpd kmod-nft-tproxy; do
            apk info -e "$package"
          done
          for tool in xray ucode curl nft ip ss flock; do
            command -v "$tool"
          done
          test "$(uci -q get exconnect.main.enabled)" = 0
          test -x /etc/init.d/exconnect
          test -x /usr/libexec/exconnect/control
          test -x /usr/libexec/exconnect/run
          test -x /usr/libexec/rpcd/exconnect
          test -x /usr/libexec/rpcd/exconnect-subscriptions
          test -s /usr/share/luci/menu.d/luci-app-exconnect.json
          test -s /usr/share/rpcd/acl.d/luci-app-exconnect.json
          test -s /usr/lib/lua/luci/i18n/exconnect.ru.lmo
          test -s /www/luci-static/resources/exconnect/client.js
          test -s /www/luci-static/resources/view/exconnect/overview.js
          IPKG_INSTROOT=/ apk add coreutils-base64 diffutils
          /bin/sh /tmp/runtime.sh
          OPENWRT
          unshare --net bash -e -c '
            ip link set lo up
            chroot "$1" /bin/sh /tmp/proxy-smoke.sh --disposable-openwrt
          ' bash "$rootfs"
          HOST
      - uses: actions/upload-artifact@v4
        with:
          name: exconnect-openwrt-25.12.5-x86-64
          path: dist/*.apk
          if-no-files-found: error
