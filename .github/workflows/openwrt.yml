name: OpenWrt 25.12.5

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/source.test.cjs
      - run: bash -n scripts/build-openwrt.sh && bash -n tests/package-install-ci.sh

  sdk:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      OPENWRT_URL: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64
      SDK_ARCHIVE: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      SDK_SHA256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
      ROOTFS_ARCHIVE: openwrt-25.12.5-x86-64-generic-targz-rootfs.tar.gz
      ROOTFS_SHA256: 4f191a9684949b15db02bb1ccdacaa8192ffb4598ce92e70b5337ca50df7912a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Find packages from an identical build
        id: previous-build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sdk=$(grep -E '^      (OPENWRT_URL|SDK_ARCHIVE|SDK_SHA256):' .github/workflows/openwrt.yml | head -n 3)
          for previous in $(git rev-list --first-parent --max-count=5 HEAD | tail -n +2); do
            git diff --quiet "$previous" HEAD -- .gitattributes packages scripts/build-openwrt.sh || break
            previous_sdk=$(git show "$previous:.github/workflows/openwrt.yml" | grep -E '^      (OPENWRT_URL|SDK_ARCHIVE|SDK_SHA256):' | head -n 3)
            [ -n "$previous_sdk" ] && [ "$previous_sdk" = "$current_sdk" ] || break
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/openwrt.yml/runs" \
              -f branch=main -f event=push -f head_sha="$previous" -f per_page=1 \
              --jq '.workflow_runs[0].id // empty') || exit 0
            [ -n "$run_id" ] || continue
            artifact_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              -f name=exconnect-openwrt-25.12.5 --jq '.artifacts[] | select(.expired == false) | .id') || exit 0
            [ -n "$artifact_id" ] || continue
            printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
            break
          done
      - name: Download packages from the identical build
        id: previous-packages
        if: steps.previous-build.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: exconnect-openwrt-25.12.5
          path: dist
          run-id: ${{ steps.previous-build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Install build dependencies
        if: steps.previous-packages.outcome != 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget zstd
      - name: Prepare official SDK
        if: steps.previous-packages.outcome != 'success'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$SDK_ARCHIVE" \
            "$OPENWRT_URL/$SDK_ARCHIVE"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/$SDK_ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/openwrt-sdk"
          tar --zstd -xf "$RUNNER_TEMP/$SDK_ARCHIVE" -C "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
      - name: Test Xray configuration in OpenWrt userspace
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$ROOTFS_ARCHIVE" "$OPENWRT_URL/$ROOTFS_ARCHIVE"
          printf '%s  %s\n' "$ROOTFS_SHA256" "$RUNNER_TEMP/$ROOTFS_ARCHIVE" | sha256sum --check
          rootfs="$RUNNER_TEMP/openwrt-rootfs"
          mkdir "$rootfs"
          sudo tar -xzf "$RUNNER_TEMP/$ROOTFS_ARCHIVE" -C "$rootfs"
          sudo mkdir -p "$rootfs/dev" "$rootfs/proc" "$rootfs/tmp/lock" "$rootfs/usr/libexec/exconnect"
          sudo cp -L --remove-destination /etc/resolv.conf "$rootfs/etc/resolv.conf"
          sudo cp tests/runtime.sh "$rootfs/tmp/runtime.sh"
          sudo cp packages/exconnect/files/usr/libexec/exconnect/*.uc "$rootfs/usr/libexec/exconnect/"
          sudo unshare --mount --propagation private bash -e -c '
            rootfs=$1
            mount --bind /dev "$rootfs/dev"
            mount -t proc proc "$rootfs/proc"
            chroot "$rootfs" /bin/sh -ec "apk update && apk add xray-core ucode ucode-mod-fs ucode-mod-uci jsonfilter coreutils-base64 diffutils"
            chroot "$rootfs" /bin/sh /tmp/runtime.sh
          ' bash "$rootfs"
      - name: Build packages
        if: steps.previous-packages.outcome != 'success'
        run: bash scripts/build-openwrt.sh "$RUNNER_TEMP/openwrt-sdk"
      - name: Test installation of the built packages
        run: |
          rootfs="$RUNNER_TEMP/openwrt-install-test"
          mkdir "$rootfs"
          sudo tar -xzf "$RUNNER_TEMP/$ROOTFS_ARCHIVE" -C "$rootfs"
          bash tests/package-install-ci.sh "$rootfs" dist
      - uses: actions/upload-artifact@v4
        with:
          name: exconnect-openwrt-25.12.5
          path: dist/*.apk
          if-no-files-found: error

  arm64:
    needs: sdk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      OPENWRT_URL: https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8
      OPENWRT_IMAGE: openwrt-25.12.5-rockchip-armv8-friendlyarm_nanopi-r3s-ext4-sysupgrade.img.gz
      OPENWRT_SHA256: 0d5d5da4b610ec1b167e17708d15689b9a203a91e0f22e997abe3a3992ac2e79
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exconnect-openwrt-25.12.5
          path: dist
      - name: Prepare NanoPi R3S OpenWrt userspace
        run: |
          archive="$RUNNER_TEMP/$OPENWRT_IMAGE"
          curl --fail --location --retry 3 --output "$archive" "$OPENWRT_URL/$OPENWRT_IMAGE"
          printf '%s  %s\n' "$OPENWRT_SHA256" "$archive" | sha256sum --check
          disk="$RUNNER_TEMP/openwrt-r3s.img"
          # Decode the gzip member before OpenWrt's appended sysupgrade metadata.
          python3 -c 'import sys,zlib; sys.stdout.buffer.write(zlib.decompress(sys.stdin.buffer.read(), 31))' < "$archive" > "$disk"
          sector=$(partx --noheadings --raw --nr 2 --output START "$disk")
          rootfs="$RUNNER_TEMP/openwrt-r3s-rootfs"
          mount_dir=$(mktemp -d)
          mkdir "$rootfs"
          sudo mount -t ext4 -o "loop,ro,noload,offset=$((sector * 512))" "$disk" "$mount_dir"
          trap 'sudo umount "$mount_dir"' EXIT
          sudo cp -a "$mount_dir/." "$rootfs/"
          grep -qx "DISTRIB_TARGET='rockchip/armv8'" "$rootfs/etc/openwrt_release"
          grep -qx "DISTRIB_ARCH='aarch64_generic'" "$rootfs/etc/openwrt_release"
      - name: Test installation in NanoPi R3S userspace
        run: bash tests/package-install-ci.sh "$RUNNER_TEMP/openwrt-r3s-rootfs" dist

  release:
    needs: [sdk, arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: exconnect-release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exconnect-openwrt-25.12.5
          path: dist
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- dist/exconnect-[0-9]*.apk dist/luci-app-exconnect-[0-9]*.apk
          test "$#" -eq 2 && test -f "$1" && test -f "$2" || exit 1
          version=${1#dist/exconnect-}
          version=${version%.apk}
          test "$2" = "dist/luci-app-exconnect-$version.apk"
          asset=exconnect-openwrt-25.12.5.zip
          tag=v$version
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release download "$tag" --pattern "$asset"
          else
            python3 -m zipfile -c "$asset" "$@"
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --latest \
              --title "ExConnect $version" --notes 'OpenWrt 25.12.5 packages tested on x86/64 and NanoPi R3S (ARM64).'
          fi

          branch=openwrt-packages
          if ! gh api "repos/$GH_REPO/git/ref/heads/$branch" --silent; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" --silent
          fi
          endpoint="repos/$GH_REPO/contents/$asset"
          current=$(gh api "$endpoint?ref=$branch" --jq .sha 2>/dev/null) || current=
          if [ "$current" != "$(git hash-object "$asset")" ]; then
            jq -n --arg branch "$branch" --arg message "Publish ExConnect $version for OpenWrt" \
              --arg content "$(base64 -w 0 "$asset")" --arg sha "$current" \
              '{branch:$branch,message:$message,content:$content} + (if $sha == "" then {} else {sha:$sha} end)' |
              gh api --method PUT "$endpoint" --input - --silent
          fi
          curl -fsSL --retry 4 --retry-all-errors -o /tmp/exconnect-public.zip \
            "https://raw.githubusercontent.com/$GH_REPO/$branch/$asset"
          cmp "$asset" /tmp/exconnect-public.zip
